<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Kyzyl Aspan — 26 years of MODIS and VIIRS fire detections on one comparable H3 scale, with noise filtering, AI risk briefings and a concept space segment."
    />
    <meta property="og:title" content="Kyzyl Aspan — fire from space, on one honest scale" />
    <meta property="og:image" content="/brand/kyzyl-aspan-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kyzyl Aspan — fire from space, on one honest scale</title>
    <script>
      // Dark is the only theme; drop the old saved choice from the light/dark era.
      try {
        localStorage.removeItem("kyzylaspan.theme");
      } catch (e) {}
      // The landing page opens on the Earth: start fetching its daylight texture right away.
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.href = "/textures/earth/earth_day_4096.jpg";
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      }
      try {
        var s = JSON.parse(localStorage.getItem('kyzylaspan.locale') || 'null');
        if (s && /^(en|ru|kk|es|fr|de|pt|zh)$/.test(s.locale)) document.documentElement.lang = s.locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kyzyl Aspan needs JavaScript to draw the globe, maps and charts.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
